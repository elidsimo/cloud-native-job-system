# Exemple : copie ce fichier en secret.yaml et remplace les valeurs.
# secret.yaml est ignoré par Git : ne commite jamais de vraies valeurs.
apiVersion: v1
kind: Secret
metadata:
  name: cloud-job-secret
  namespace: cloud-job-system
type: Opaque
stringData:
  POSTGRES_PASSWORD: CHANGE_ME
  DATABASE_URL: postgresql://postgres:CHANGE_ME@postgres-service:5432/cloud_job_system?schema=public
