name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Une nouvelle exécution annule la précédente sur une pull request,
# mais jamais sur main (on veut que les images partent).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: eu-west-1
  # Trivy est lancé depuis son image Docker, figée par son empreinte
  TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969

jobs:
  test:
    name: Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api-service, worker-service]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le client Prisma
        run: npx prisma generate

      - name: Compiler
        run: npm run build

      - name: Lancer les tests
        run: npm test

  helm:
    name: Chart Helm
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - name: Vérifier le chart
        run: |
          helm lint helm/cloud-job-system \
            -f helm/values-dev.yaml \
            --set image.registry=123456789012.dkr.ecr.eu-west-1.amazonaws.com

  image:
    name: Image ${{ matrix.name }}
    needs: [test, helm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # nécessaire pour la connexion OIDC à AWS
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            service: api-service
            repository: cloud-job-platform/api
          - name: worker
            service: worker-service
            repository: cloud-job-platform/worker
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Construire l'image
        run: docker build -t "local/${{ matrix.name }}:${GITHUB_SHA}" "./${{ matrix.service }}"

      - name: Analyser les vulnérabilités (Trivy)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "$TRIVY_IMAGE" image \
              --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
              --exit-code 1 --no-progress \
              "local/${{ matrix.name }}:${GITHUB_SHA}"

      # Les étapes suivantes ne tournent que sur un push dans main :
      # une pull request construit et scanne, mais n'envoie rien.
      - name: Se connecter à AWS (OIDC)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Se connecter à ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Envoyer l'image dans ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ matrix.repository }}
        run: |
          # Les tags ECR sont immuables : si l'image existe déjà (ré-exécution), on ne renvoie rien.
          if aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageTag="$GITHUB_SHA" > /dev/null 2>&1; then
            echo "L'image $REPOSITORY:$GITHUB_SHA existe déjà : rien à envoyer."
          else
            docker tag "local/${{ matrix.name }}:${GITHUB_SHA}" "$REGISTRY/$REPOSITORY:$GITHUB_SHA"
            docker push "$REGISTRY/$REPOSITORY:$GITHUB_SHA"
            echo "Image envoyée : $REPOSITORY:$GITHUB_SHA"
          fi
