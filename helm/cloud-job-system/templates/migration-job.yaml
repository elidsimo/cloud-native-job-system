{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  labels:
    {{- include "cjs.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    # Exécuté AVANT chaque installation et chaque mise à jour
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    # Supprimé s'il réussit ; conservé s'il échoue (pour lire ses journaux)
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "cjs.labels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      securityContext:
        {{- include "cjs.podSecurityContext" . | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "cjs.image" (list . .Values.api) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
          env:
            {{- include "cjs.databaseEnv" . | nindent 12 }}
          securityContext:
            {{- include "cjs.containerSecurityContext" . | nindent 12 }}
{{- end }}
